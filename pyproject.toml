[project]
name = "docevisao"
version = "0.1.0"
description = "Sistema de Business Intelligence para docerias"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pandas>=2.0,<3.0",
    "pandera>=0.20,<1.0",
    "plotly>=5.0,<6.0",
    "streamlit>=1.38,<2.0",
    "httpx>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1,<4.0",
    "scikit-learn>=1.5,<2.0",
    "statsmodels>=0.14,<1.0",
    "prophet>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "coverage>=7.0,<8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["B008", "B904", "SIM102", "SIM108", "UP042"]

[tool.ruff.lint.per-file-ignores]
"*/ml/**/*.py" = ["N806"]  # X, X_scaled are standard ML conventions

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "*/alembic/*",
    "*/tests/*",
    "*/ml/*",
]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.setuptools.packages.find]
where = ["backend"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
