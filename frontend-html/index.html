<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DoceVisão — Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">🧁 DoceVisão</div>
        <ul class="menu">
            <li><a href="index.html" class="active">📊 Visão Geral</a></li>
            <li><a href="pages/produtos.html">🍰 Produtos</a></li>
            <li><a href="pages/canais.html">📅 Canais e Períodos</a></li>
            <li><a href="pages/producao.html">🏭 Produção</a></li>
            <li><a href="pages/insights.html">💡 Insights</a></li>
            <li><a href="pages/importacao.html">📥 Importação</a></li>
            <li><a href="pages/sobre.html">📖 Sobre</a></li>
        </ul>
    </nav>

    <main class="content">
        <header>
            <h1>Visão Geral</h1>
            <div class="filters">
                <label>
                    Data inicial:
                    <input type="date" id="startDate" value="2025-01-01">
                </label>
                <label>
                    Data final:
                    <input type="date" id="endDate" value="2025-07-31">
                </label>
                <button id="applyFilters" class="btn-primary">Aplicar</button>
            </div>
        </header>

        <section class="kpi-cards">
            <div class="card">
                <h3>Faturamento</h3>
                <div class="value" id="faturamento">R$ 0,00</div>
                <div class="delta" id="faturamentoDelta"></div>
            </div>
            <div class="card">
                <h3>Pedidos</h3>
                <div class="value" id="pedidos">0</div>
            </div>
            <div class="card">
                <h3>Ticket Médio</h3>
                <div class="value" id="ticketMedio">R$ 0,00</div>
            </div>
            <div class="card">
                <h3>Itens Vendidos</h3>
                <div class="value" id="itensVendidos">0</div>
            </div>
        </section>

        <section class="charts">
            <div class="chart-container">
                <h2>Evolução do Faturamento</h2>
                <div id="timelineChart"></div>
            </div>
            <div class="chart-container">
                <h2>Vendas por Dia da Semana</h2>
                <div id="weekdayChart"></div>
            </div>
        </section>

        <section class="insights-summary">
            <h2>Resumo Narrativo</h2>
            <div id="insightsList"></div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
